[package]
name = "pvot_pdf_engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "pvot_pdf_engine"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
lopdf = { version = "0.33", default-features = false, features = ["pom_parser"] }
flate2 = "1"
encoding_rs = "0.8"
zune-jpeg = "0.5.15"

[profile.release]
panic = "unwind"
